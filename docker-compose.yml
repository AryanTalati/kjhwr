# Local development: API with hot reload on :8000, Vite dev server on :5173 (proxies /api).
# `docker compose --profile prod up --build web` runs the production image on :8080 instead.
services:
  backend:
    build:
      context: .
      target: backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data

  frontend:
    image: node:22-alpine
    working_dir: /src
    command: sh -c "npm ci && npm run dev"
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/src
      - /src/node_modules
    depends_on:
      - backend

  web:
    profiles: ["prod"]
    build: .
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
